<div style="padding: 20px; font-family: Arial, sans-serif;">
  <h2>📚 Catálogo de Libros Disponibles (Comunidad)</h2>
  <p>Explora los libros publicados por otros lectores y solicita un intercambio:</p>

  <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
    @for (item of catalogo; track item.libro.id) {
      <div style="border: 1px solid #ccc; border-radius: 8px; padding: 15px; width: 220px; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); background-color: #fff;">
        <div style="width: 100%; height: 140px; background-color: #e0e0e0; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; font-weight: bold; color: #555;">
          📖 Portada
        </div>
        <h4 style="margin: 5px 0;">{{ item.libro.titulo }}</h4>
        <p style="margin: 3px 0; color: #666; font-size: 14px;">Autor: {{ item.libro.autor }}</p>
        <p style="margin: 3px 0; color: #888; font-size: 12px;">Propietario: <strong>{{ item.propietario }}</strong></p>
        
        <button (click)="solicitarIntercambio(item)" style="margin-top: 10px; width: 100%; background-color: #ff9900; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 4px; cursor: pointer;">
          Solicitar Intercambio
        </button>
      </div>
    }
  </div>
</div>
