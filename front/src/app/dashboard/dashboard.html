<!-- Cabecera de la aplicación -->
<header id="cabecera-principal" class="cabecera-naranja">
  <div class="contenedor-izquierdo">
    <img src="assets/logo.png" alt="Logo" class="logo-pequeño">
    <h1 id="titulo-sistema" class="titulo-blanco">Swop-For-All</h1>
  </div>
  
  <!-- Contenedor de botones funcionales a la derecha -->
  <nav id="navegacion-principal" class="contenedor-derecho">
    <button id="btn-deseados" class="boton-cabecera">Lista de Deseados</button>
    <button id="btn-inventario" class="boton-cabecera">Inventario</button>
    <button id="btn-comunidad" class="boton-cabecera">Comunidad</button>
    <button id="btn-intercambio" class="boton-cabecera">Intercambio</button>
    <button id="btn-perfil" class="boton-cabecera">Perfil</button>
    <button id="btn-cerrar-sesion" class="boton-cabecera">Cerrar Sesión</button>
  </nav>
</header>

<!-- Área de contenido dinámico del menú principal -->
<main id="contenido-dashboard" class="area-trabajo">
  <section class="bienvenida-dashboard">
    <h2>¿Qué deseas leer hoy?</h2>
    <p>Explora el catálogo o revisa tus intercambios pendientes.</p>
  </section>
</main>
