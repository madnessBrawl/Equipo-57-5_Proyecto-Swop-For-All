<header id="cabecera-principal" class="cabecera-naranja">
  <div class="contenedor-izquierdo">
    <!-- Mantenemos el logo que sí carga correctamente -->
    <img src="/imagenes/logo-principal-Swop-For-All.png" alt="Logo Swop-For-All" class="logo-pequeño">
    <h1 id="titulo-sistema" class="titulo-blanco">Swop-For-All</h1>
  </div>
  
  <!-- Traemos los botones funcionales -->
  @if (mostrarMenu) {
    <nav id="navegacion-principal" class="contenedor-derecho">
      <button id="btn-deseados" class="boton-icono">
        <img src="/imagenes/lista-libros-deseados-logo.png" alt="Deseados" class="icono-nav">
        <span class="texto-icono">Libros deseados</span>
      </button>
      
      <button id="btn-inventario" class="boton-icono">
        <img src="/imagenes/Inventario-logo.png" alt="Inventario" class="icono-nav">
        <span class="texto-icono">Inventario</span>
      </button>
      
      <!-- Contenedor de Comunidad (Independiente) -->
      <div class="contenedor-dropdown" style="position: relative; display: inline-block;">
        <button id="btn-comunidad" class="boton-icono" (click)="toggleMenuComunidad()">
          <img src="/imagenes/comunidad-logo.png" alt="Comunidad" class="icono-nav">
          <span class="texto-icono">Comunidad</span>
        </button>

        <!-- Menú desplegable (Dropdown) de Comunidad -->
        @if (mostrarMenuComunidad) {
          <div class="dropdown-menu">
            <button class="dropdown-item" (click)="navegarA('/ver-comunidades')">Ver comunidades</button>
            <button class="dropdown-item" (click)="navegarA('/mi-comunidad')">Mi comunidad</button>
            <button class="dropdown-item" (click)="verificarLimiteYCrear()">Crear nueva comunidad</button>
          </div>
        }
      </div>

      <!-- Botón de Catálogo con la misma estructura de diseño (boton-icono) -->
      <button routerLink="/catalogo" id="btn-catalogo" class="boton-icono">
        <div class="icono-nav" style="font-size: 20px; display: flex; align-items: center; justify-content: center;">📚</div>
        <span class="texto-icono">Catálogo</span>
      </button>
      
      <!-- Botón de Intercambiar vinculado directamente a tu ruta de modificar oferta -->
      <button routerLink="/modificar-oferta" id="btn-intercambio" class="boton-icono">
        <img src="/imagenes/Intercambio-logo.png" alt="Intercambiar" class="icono-nav">
        <span class="texto-icono">Intercambiar</span>
      </button>
      
      <!-- Reputación -->
      <button id="btn-reputacion" class="boton-icono" (click)="irAReputacion()">
        <img src="/imagenes/calificacion-estrella-llena.png" alt="Reputación" class="icono-nav">
        <span class="texto-icono">Reputación</span>
      </button>

      <button id="btn-perfil" class="boton-icono">
        <img src="/imagenes/Perfil-logo.png" alt="Perfil" class="icono-nav">
        <span class="texto-icono">Perfil</span>
      </button>
      
      <button id="btn-cerrar-sesion" class="boton-icono" (click)="cerrarSesion()">
        <img src="/imagenes/salir-de-pagina-logo.png" alt="Cerrar Sesión" class="icono-nav">
        <span class="texto-icono">Cerrar sesión</span>
      </button>
    </nav>
  }
</header>
