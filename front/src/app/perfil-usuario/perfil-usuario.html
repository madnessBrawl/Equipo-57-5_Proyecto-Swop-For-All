
<div id="bloque-registro" class="contenedor-perfil">
  
  <h2 id="titulo-seccion-perfil">Crear Cuenta en Swop-For-All</h2>
  <p class="descripcion-seccion">Regístrate para empezar a intercambiar tus libros con la comunidad.</p>

  
  <form id="formulario-registro-usuario" (ngSubmit)="procesarRegistroNuevo()">
    
    <div class="grupo-entrada">
      <label for="campo-usuario-login">Nombre de Usuario (Alias):</label>
      <input type="text" id="campo-usuario-login" name="nombreUsuario" [(ngModel)]="datosRegistro.usuario" required placeholder="Ej: gabriel_lector">
    </div>

    <div class="grupo-entrada">
      <label for="campo-nombre">Nombre:</label>
      <input type="text" id="campo-nombre" name="primerNombre" [(ngModel)]="datosRegistro.nombre" required placeholder="Ej: Gabriel">
    </div>

    <div class="grupo-entrada">
      <label for="campo-apellido">Apellido:</label>
      <input type="text" id="campo-apellido" name="primerApellido" [(ngModel)]="datosRegistro.apellido" required placeholder="Ej: Alfonso">
    </div>

    <div class="grupo-entrada">
      <label for="campo-genero-biologico">Género:</label>
      <select id="campo-genero-biologico" name="generoBiologico" [(ngModel)]="datosRegistro.genero" required>
        <option value="" disabled selected>Selecciona tu género</option>
        <option value="Hombre">Hombre</option>
        <option value="Mujer">Mujer</option>
      </select>
    </div>

    <div class="grupo-entrada">
      <label for="campo-correo-ins">Correo Electrónico:</label>
      <input type="email" id="campo-correo-ins" name="correoElectronico" [(ngModel)]="datosRegistro.correo" required placeholder="tu@correo.com">
    </div>

    <div class="grupo-entrada">
      <label for="campo-clave-ins">Contraseña:</label>
      <input type="password" id="campo-clave-ins" name="contrasenia" [(ngModel)]="datosRegistro.clave" required placeholder="Mínimo 6 caracteres">
    </div>

    <div class="grupo-entrada">
      <label for="campo-generos-favoritos">Géneros Literarios Favoritos:</label>
      <input type="text" id="campo-generos-favoritos" name="generosFavoritos" [(ngModel)]="datosRegistro.generosFavoritos" placeholder="Ej: Novela, Ciencia Ficción, Terror">
    </div>

    <div id="seccion-acciones-registro" class="botones-alineados">
      <button type="submit" id="boton-registrar-usuario" class="boton-guardar">Registrar mi Cuenta</button>
    </div>

  </form>

</div>
