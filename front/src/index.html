<!--
Como compilar el codigo?
1. Abre una terminal en la carpeta del proyecto.
2. Ingresas a la carpeta front con el comando: cd front
3. escribes el comando: npm start o ng serve
4. Este activara un servidor de desarrollo y podras ver la aplicacion en tu navegador en la direccion: http://localhost:4200/
5. Para detener el servidor de desarrollo, presiona Ctrl + C en la terminal.

-->


<!--
Como acitvar el servidor Backend(Persistencia JSON)?
1. Abre una terminal en la carpeta del proyecto.
2. Ingresas a la carpeta back con el comando: cd back
3. escribes el comando: ng serve
4.Veras el siguiente mensaje: Servidor Swop-For-All escuchando en http://localhost:3000
5.La persistencia .JSON se activa de forma automática: A partir de ese momento, todas las peticiones que lleguen al servidor leerán
y escribirán físicamente en los archivos dentro de la carpeta back/Persistencia/:
- libros.json
- usuarios.json
- intercambios.json
- calificaciones.json
- comunidades.json

Importante: Deja esa terminal abierta para que el servidor siga corriendo en segundo plano.

-->
